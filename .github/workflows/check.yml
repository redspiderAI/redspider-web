name: Website checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser checks
        run: |
          npm run preview -- --host 127.0.0.1 --port 4188 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:4188/ > /dev/null && break
            sleep 1
          done
          node scripts/smoke.mjs
