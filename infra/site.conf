server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location = /healthz { access_log off; return 200 "ok\n"; }
    location = / { add_header Cache-Control "no-cache" always; try_files /index.html =404; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable" always; try_files $uri =404; }
    location / { add_header Cache-Control "no-cache" always; try_files $uri $uri/ =404; }
}
